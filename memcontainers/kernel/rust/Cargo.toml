# Manifest for crate_universe dependency resolution only — the kernel BUILDS via Bazel
# (rust_shared_library → kernel.wasm), not cargo. It lists the external crates.io deps;
# the `abi` role is filled by the generated //contracts:*_rust bindings (a Bazel dep),
# not a crate. Keep the versions in lockstep with memcontainers crates/kernel.
[package]
name = "kernel"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
talc = "5.0.3"
# Keep eager translation outside guest fuel slices. Validation and memory64
# match the guest feature profile. Portable indirect dispatch stores opcodes
# instead of handler pointers in kernel memory, which survives snapshot restore.
wasmi = { version = "=2.0.0", default-features = false, features = [
  "validate",
  "memory64",
  "portable-dispatch",
  "indirect-dispatch",
] }
wasmparser = { version = "=0.228.0", default-features = false, features = ["features", "validate"] }
